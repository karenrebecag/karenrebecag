name: Terminal card

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Render card
        # github.token only sees public activity, which drops private contributions
        # from the totals. CARD_TOKEN (a PAT with read:user) keeps them counted.
        env:
          GITHUB_TOKEN: ${{ secrets.CARD_TOKEN || github.token }}
        run: node scripts/render-card.mjs

      - name: Commit card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/terminal.svg
          git diff --staged --quiet || (git commit -m "chore: refresh terminal card" && git push)
